name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            lineup_guesser/package-lock.json
            bracket_city/package-lock.json
            hangman/package-lock.json

      - name: Install lineup_guesser dependencies
        run: npm ci
        working-directory: lineup_guesser

      - name: Build lineup_guesser
        run: npm run build
        working-directory: lineup_guesser

      - name: Install bracket_city dependencies
        run: npm ci
        working-directory: bracket_city

      - name: Build bracket_city
        run: npm run build
        working-directory: bracket_city

      - name: Install hangman dependencies
        run: npm ci
        working-directory: hangman

      - name: Build hangman
        run: npm run build
        working-directory: hangman

      - name: Assemble site
        run: |
          mkdir -p _site/lineup_guesser
          mkdir -p _site/bracket_city
          mkdir -p _site/hangman
          cp index.html _site/
          cp -r kalender _site/
          cp -r pokemon _site/
          cp -r lineup_guesser/dist/* _site/lineup_guesser/
          cp -r bracket_city/dist/* _site/bracket_city/
          cp -r hangman/dist/* _site/hangman/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
